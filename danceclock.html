<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dance clock</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--dim:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--fg:#f2f2f2;--dim:#6d7078;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101114;--fg:#f2f2f2;--dim:#6d7078;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:12px/1.6 "Hiragino Kaku Gothic ProN",Verdana,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#snd{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font:inherit;background:none;color:var(--fg);border:1px solid var(--dim);padding:4px 12px;cursor:pointer}
#snd:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#nt{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);color:var(--dim);font-size:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="snd">音 off</button>
<div id="nt">オリジナルのイラストによるオマージュ作品です</div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,dpr,last=-1,ac=null,on=false;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function eob(t){t=Math.min(1,t);var s=1.9;t-=1;return t*t*((s+1)*t+s)+1}
function tick(){if(!on||!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1500;o.type='square';g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.04);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.05)}
var sb=document.getElementById('snd');
sb.onclick=function(){on=!on;if(on&&!ac)ac=new(window.AudioContext||window.webkitAudioContext)();sb.textContent=on?'音 on':'音 off'};

function line(a,b,d,e,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function limb(sx,sy,t1,t2,l1,l2,w,col){var ex=sx+Math.sin(t1)*l1,ey=sy+Math.cos(t1)*l1,fx=ex+Math.sin(t2)*l2,fy=ey+Math.cos(t2)*l2;x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(sx,sy);x.lineTo(ex,ey);x.lineTo(fx,fy);x.stroke()}
var R=Math.PI/180;
function dancer(px,py,k,t,mv,dress,fg,hair,flip){
 var cyc=Math.sin(t*2*Math.PI),bob=Math.abs(Math.sin(Math.PI*t))*(mv===3?14:7),sway=(mv===1?cyc*7:0);
 x.save();x.translate(px,py);x.scale(k*flip,k);
 var hx=sway,hy=-48-bob,sx=sway*1.4,sy=-95-bob,w=5;
 var spread=mv===3?10+Math.abs(cyc)*10:12+(mv===1?cyc*6:0);
 line(hx-4,hy,-spread,0,w,fg);line(hx+4,hy,spread+(mv===1?cyc*8:0),0,w,fg);
 x.fillStyle=dress;x.beginPath();x.moveTo(sx-11,sy);x.lineTo(sx+11,sy);x.lineTo(hx+22,hy+12);x.lineTo(hx-22,hy+12);x.closePath();x.fill();
 var aL,aR,fL,fR;
 if(mv===0){aL=(100+55*cyc)*R;aR=(100-55*cyc)*R;fL=aL+30*R;fR=aR+30*R}
 else if(mv===1){aL=(35+14*cyc)*R;aR=(35-14*cyc)*R;fL=aL+25*R;fR=aR+25*R}
 else if(mv===2){aL=15*R;fL=25*R;aR=(150+10*cyc)*R;fR=aR+(40*Math.sin(t*4*Math.PI))*R}
 else{aL=aR=(60+55*Math.abs(cyc))*R;fL=aL+20*R;fR=aR+20*R}
 limb(sx-10,sy+2,-aL,-fL,22,20,w,fg);limb(sx+10,sy+2,aR,fR,22,20,w,fg);
 x.fillStyle='#f3cfb1';x.beginPath();x.arc(sx,sy-17,13,0,7);x.fill();
 x.fillStyle=hair;x.beginPath();x.arc(sx,sy-19,14,Math.PI,0);x.lineTo(sx+14,sy-6);x.lineTo(sx+10,sy-12);x.lineTo(sx-10,sy-12);x.lineTo(sx-14,sy-6);x.closePath();x.fill();
 x.restore()}

function clock(cx,cy,r,n,hue,fg,dim){
 var h=n.getHours()%12,m=n.getMinutes(),s=n.getSeconds(),ms=n.getMilliseconds();
 x.strokeStyle=fg;x.lineWidth=2;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
 for(var i=0;i<60;i++){var a=i*6*R,l=i%5?r*.04:r*.1;line(cx+Math.sin(a)*(r-l),cy-Math.cos(a)*(r-l),cx+Math.sin(a)*(r-2),cy-Math.cos(a)*(r-2),i%5?1:2.5,i%5?dim:fg)}
 var ha=(h+m/60)*30*R,ma=(m+s/60)*6*R,sa=(s+eob(ms/280))*6*R;
 line(cx,cy,cx+Math.sin(ha)*r*.5,cy-Math.cos(ha)*r*.5,5,fg);
 line(cx,cy,cx+Math.sin(ma)*r*.78,cy-Math.cos(ma)*r*.78,3,fg);
 var col='hsl('+hue+',80%,52%)';
 line(cx-Math.sin(sa)*r*.15,cy+Math.cos(sa)*r*.15,cx+Math.sin(sa)*r*.9,cy-Math.cos(sa)*r*.9,2,col);
 x.fillStyle=col;x.beginPath();x.arc(cx,cy,5,0,7);x.fill()}

function frame(){
 var n=new Date(),s=n.getSeconds(),m=n.getMinutes(),hr=n.getHours(),beat=n.getMilliseconds()/1000;
 if(s!==last){last=s;tick()}
 var bg=css('--bg'),fg=css('--fg'),dim=css('--dim'),hue=(hr%12)*30+10;
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 var r=Math.min(W*.3,H*.17);
 clock(W/2,Math.max(r+70,H*.22),r,n,hue,fg,dim);
 var f=function(v){return('0'+v).slice(-2)};
 x.fillStyle=fg;x.font='200 '+Math.round(r*.32)+'px Helvetica,Arial,sans-serif';x.textAlign='center';x.textBaseline='top';
 x.fillText(f(hr)+':'+f(m)+':'+f(s),W/2,Math.max(r+70,H*.22)+r+14);
 var N=W<600?3:5,gap=W/(N+1),k=Math.min(H*.3/125,gap/60),base=H-46,mv=m%4;
 x.fillStyle=dim;x.fillRect(W*.08,base+2,W*.84,1);
 var hairs=['#2a1d18','#4a2c1f','#1c1c24','#7a4a2a','#222'];
 for(var i=0;i<N;i++){var t=(beat+i*.12)%1;
  dancer(gap*(i+1),base,k,t,mv,'hsl('+((hue+i*47)%360)+',75%,'+(60-i%2*8)+'%)',fg,hairs[i%5],i%2?-1:1)}
 requestAnimationFrame(frame)}
frame();
})();
</script>
</body>
</html>
