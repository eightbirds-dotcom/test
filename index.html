<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOBILE FLASH 2000s</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #05090f;
    --accent: #00f0ff;
    --accent-dim: rgba(0, 240, 255, 0.15);
    --border: #13344a;
    --text: #a8cae6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 16px;
    position: relative;
  }

  /* 走査線（スキャンライン） */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.45) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 100;
  }

  /* 端末風フレーム */
  .device-frame {
    flex: 1;
    border: 1px solid var(--accent);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    display: flex;
    flex-direction: column;
    background: rgba(8, 16, 26, 0.95);
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
  }

  /* 上部：Flashアニメーション風シミュレータ */
  .monitor-box {
    height: 180px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0d2238 0%, #05090f 100%);
  }

  .vector-circle {
    width: 100px;
    height: 100px;
    border: 1px dashed var(--accent);
    border-radius: 50%;
    animation: rotate 6s linear infinite;
  }

  .vector-square {
    width: 60px;
    height: 60px;
    border: 1px solid rgba(0, 240, 255, 0.5);
    position: absolute;
    animation: rotate-rev 3s linear infinite;
  }

  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes rotate-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

  /* 下部：インタラクティブパネル */
  .interactive-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }

  .tabs {
    display: flex;
    gap: 8px;
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 8px 4px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: 0.15s;
  }

  .tab-btn.active {
    background: var(--accent);
    color: #000;
    font-weight: bold;
    box-shadow: 0 0 10px var(--accent);
  }

  .log-display {
    flex: 1;
    border: 1px solid var(--border);
    background: rgba(4, 9, 15, 0.8);
    padding: 12px;
    font-size: 12px;
    line-height: 1.6;
    overflow-y: auto;
  }

  .footer {
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    font-size: 10px;
    color: #4b6a8a;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="device-frame">
  <div class="header">
    <div>// SWF_ARCHIVE.2003</div>
    <div id="fps">FPS: 60.0</div>
  </div>

  <div class="monitor-box">
    <div class="vector-circle"></div>
    <div class="vector-square"></div>
  </div>

  <div class="interactive-area">
    <div class="tabs">
      <button class="tab-btn active" data-msg="[PROJECT: 2Advanced]<br>2000年代初頭、世界に衝撃を与えたサイバーコックピットUI。近未来のOSのような没入感。">01. 2ADV</button>
      <button class="tab-btn" data-msg="[CREATOR: tha ltd.]<br>中村勇吾氏によるミニマル×物理演算。幾何学モーションとタイポグラフィの最高峰。">02. YUGO</button>
      <button class="tab-btn" data-msg="[CULTURE: Flash Golden Age]<br>回線速度の制約の中で生まれた過剰なロマン。今のフラットUIにはない手触り。">03. Y2K</button>
    </div>

    <div class="log-display" id="log-text">
      [PROJECT: 2Advanced]<br>2000年代初頭、世界に衝撃を与えたサイバーコックピットUI。近未来のOSのような没入感。
    </div>
  </div>

  <div class="footer">
    <div>AUDIO: SYNTH_BEEP</div>
    <div>BUFFER: 100%</div>
  </div>
</div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;

  function beep(freq, duration) {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  const buttons = document.querySelectorAll('.tab-btn');
  const log = document.getElementById('log-text');

  buttons.forEach(btn => {
    btn.addEventListener('touchstart', () => {
      beep(880, 0.05);
      setTimeout(() => beep(1760, 0.04), 40);

      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      log.innerHTML = btn.getAttribute('data-msg');
    });
  });
</script>
</body>
</html>
